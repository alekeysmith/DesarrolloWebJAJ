<main>
    <!-- FORMULARIO 1: se envia con fetch (POST + JSON), sin recargar -->
    <form id="formMensaje" class="formulario-principal">
        <fieldset class="info-personal">
          <legend>Llena con tu información personal</legend>

          <label for="nombre">Nombre Completo:</label>
          <input type="text" id="nombre" name="nombre" required maxlength="80">

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required maxlength="120">

          <label for="fecha">Fecha de Nacimiento:</label>
          <input type="date" id="fecha" name="fecha">

          <label>Sexo:</label>
          <div class="radio-group">
              <input type="radio" id="masculino" name="sexo" value="masculino" required>
              <label for="masculino">Masculino</label>
              <input type="radio" id="femenino" name="sexo" value="femenino" required>
              <label for="femenino">Femenino</label>
          </div>

          <label>Género de películas que prefieres:</label>
          <div class="radio-group">
              <input type="radio" id="fantasia" name="pelicula" value="fantasia" required>
              <label for="fantasia"> Fantasía</label>
              <input type="radio" id="historia" name="pelicula" value="historia" required>
              <label for="historia"> Historia</label>
          </div>

          <label for="mensaje">Enviar un Mensaje:</label>
          <textarea id="mensaje" name="mensaje" rows="4" required maxlength="1000"></textarea>

          <button type="submit">Enviar</button>
          <div id="estadoMensaje" role="status"></div>
        </fieldset>
    </form>

    <!-- FORMULARIO 2: tambien con fetch -->
    <form id="formConexion" class="formulario-secundario">
        <fieldset class="conectar">
         <legend>Más maneras de conectar:</legend>

         <label for="manera">¿Qué manera prefieres?</label>
         <select id="manera" name="manera" required>
            <option value="" disabled selected>Selecciona una opción</option>
            <option value="email">Email</option>
            <option value="telefono">Teléfono</option>
            <option value="redes_sociales">Redes Sociales</option>
         </select>

         <label for="area">¿De qué área eres?</label>
         <select id="area" name="area" required>
            <option value="" disabled selected>Elige una</option>
            <option value="medicina">Medicina</option>
            <option value="ciencias_exactas">Ciencias Exactas</option>
            <option value="deportes">Deportes</option>
         </select>

         <button type="submit">Conectar</button>
         <div id="estadoConexion" role="status"></div>
        </fieldset>
    </form>
</main>
